spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    druid:
      register-mbeans: false
      validation-query: SELECT 1
      test-while-idle: true
    dynamic:
      enabled: false
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

mybatis-flex:
  datasource:
    master:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
      type: hikari
    second:
      url: jdbc:h2:mem:testdb2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
      type: hikari

me:
  redis:
    # 测试全局关闭 Redis：避免并发测试 JVM 共享本机 Redis 互踩（auth:refresh:<userId>
    # 固定 key 被另一进程覆盖/删除，刷新接口 200 变 4001）。关闭后 auth-jwt 回退内存
    # token store、auth-rbac 回退配置规则源、RedisController 条件退避；Redis 专项测试
    # （RedissonLockTest、UserCreatedEventFlowTest）用类级 TestPropertySource 单独开启
    # 并指向各自的 Testcontainers 实例
    enabled: false
  auth:
    login-rate-limit:
      enabled: false
    permission:
      rules:
        "[/api/filter-test/**]": "role('admin')"
        "[/api/filter-deny/**]": "role('superadmin')"
      roles:
        admin: "user:*,order,order:r"
      users:
        "1": admin
  mybatis:
    meta-object-handler:
      enabled: true
  snowflake:
    worker-id: 5
    datacenter-id: 1

jetcache:
  statIntervalMinutes: 0
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 50
      expireAfterWriteInMillis: 300000
  remote:
    default:
      type: mock
      keyConvertor: fastjson2
      valueEncoder: java
      valueDecoder: java
