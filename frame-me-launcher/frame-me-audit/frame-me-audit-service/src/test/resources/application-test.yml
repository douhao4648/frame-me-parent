spring:
  datasource:
    url: jdbc:h2:mem:audit-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379
  http:
    serviceclient:
      sso:
        base-url: http://localhost:10010
        read-timeout: 10s

mybatis-flex:
  datasource:
    master:
      url: jdbc:h2:mem:audit-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
      type: hikari
  global-config:
    logic-delete-column: deleted
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
  configuration:
    map-underscore-to-camel-case: true

me:
  auth:
    sa-token:
      redis:
        enabled: false
    login-rate-limit:
      enabled: false

jetcache:
  decodeFilterAllowPatterns:
    - com.frame.me.
  statIntervalMinutes: 0
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 1000
      expireAfterWriteInMillis: 120000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: fastjson2
      valueEncoder: kryo5
      valueDecoder: kryo5
      expireAfterWriteInMillis: 120000
      broadcastChannel: ${spring.application.name}
      uri: redis://localhost:6379
