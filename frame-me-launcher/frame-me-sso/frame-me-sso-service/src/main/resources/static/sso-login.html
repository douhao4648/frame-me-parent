<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SSO 登录</title>
    <link rel="stylesheet" href="/sso-login.css">
</head>
<body>
    <main class="card">
        <h1 class="title">SSO 统一登录</h1>
        <p class="subtitle">一个账号，访问所有应用</p>
        <form id="loginForm">
            <label class="field">
                <span class="label">账号</span>
                <input type="text" id="account" placeholder="请输入账号" autocomplete="username" required autofocus>
            </label>
            <label class="field">
                <span class="label">密码</span>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </label>
            <button type="submit" id="submitBtn">登 录</button>
        </form>
        <p id="msg" role="alert"></p>
    </main>
    <script src="/sso-login.js"></script>
</body>
</html>
