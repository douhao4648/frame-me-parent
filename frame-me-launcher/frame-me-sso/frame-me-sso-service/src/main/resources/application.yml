server:
  port: 10010

management:
  server:
    port: 10011
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: frame-me-sso
  jackson:
    default-property-inclusion: non_null
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

logging:
  file:
    path: ./logs
    name: ${spring.application.name}

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    logic-delete-column: deleted
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

decorator:
  datasource:
    enabled: true
    p6spy:
      enable-logging: true

sa-token:
  token-name: satoken
  # 7 天（秒）
  timeout: 604800
  # 2 天（秒）
  active-timeout: 172800
  is-concurrent: true
  is-share: true
  is-read-cookie: true
  is-read-header: true
#  cookie:
#    domain: .example.com

me:
  auth:
    enabled: true
    enforce-login: true
    whitelist:
      - /sso-login.*
      - /favicon.ico
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /v3/api-docs
    propagate:
      enabled: false
    sa-token:
      enabled: true
      path: /base/auth
      logic-type: sso
      # 7 天（秒）
      max-lifetime: 604800
  #      authorization:
  #        enabled: false
  #      jwt:
  #        enabled: true
  swagger:
    title: Frame Me Sso API
    description: Frame Me Sso 接口文档
    version: 1.0.0
    groups:
      - name: app-api
        paths-to-match:
          - /api/**
      - name: base-api
        paths-to-match:
          - /base/**
    contact:
      name: douhao4648
      email: 464834138@qq.com
      url: https://github.com/douhao4648/frame-me-parent
  sso:
    login-page:
      enabled: true
    auth-code:
      expires: 600s
    token:
      # app token 时效（大于下游 satoken、jwt 的 max-lifetime）
      app-timeout: P31D
  audit:
    enabled: true
    log-enabled: true
    target-service: frame-me-audit

jetcache:
  decodeFilterAllowPatterns:
    - com.frame.me.
  statIntervalMinutes: 15
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 1000
      expireAfterWriteInMillis: 120000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: fastjson2
      valueEncoder: kryo5
      valueDecoder: kryo5
      expireAfterWriteInMillis: 120000
      broadcastChannel: ${spring.application.name}
      uri: redis://${spring.data.redis.host:localhost}:${spring.data.redis.port:6379}/${spring.data.redis.database:0}
#      # @符号得替换成编码符
#      uri: redis://u:p@host:port/db
