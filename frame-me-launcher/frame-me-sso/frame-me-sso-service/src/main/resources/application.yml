server:
  port: 10010

management:
  server:
    port: 10011
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: frame-me-sso
  jackson:
    default-property-inclusion: non_null
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

logging:
  file:
    path: ./logs
    name: ${spring.application.name}
  level:
    com.frame.me.sso: INFO

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    logic-delete-column: deleted
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

decorator:
  datasource:
    enabled: true
    p6spy:
      enable-logging: true

sa-token:
  token-name: satoken
  # 7 天（秒）
  timeout: 604800
  # 2 小时（秒）
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  is-read-cookie: true
  is-read-header: true
  # cookie:
  #   domain: .example.com

me:
  auth:
    enabled: true
    enforce-login: true
    whitelist:
      - /base/auth/login
      - /base/auth/refresh
      - /sso-login.html
      - /favicon.ico
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /v3/api-docs
      - /actuator/**
    header-resolver:
      enabled: false
    propagate:
      enabled: false
    sa-token:
      enabled: true
      path: /base/auth
#      authorization:
#        enabled: false
  swagger:
    title: Frame Me Sso API
    description: Frame Me Sso 接口文档
    version: 1.0.0
    groups:
      - name: app-api
        paths-to-match:
          - /api/**
      - name: base-api
        paths-to-match:
          - /base/**
    contact:
      name: douhao4648
      email: 464834138@qq.com
      url: https://github.com/douhao4648/frame-me-parent
  sso:
    login-page:
      enabled: true
    auth-code:
      expires: 60s
    token:
      app-timeout: P1D

