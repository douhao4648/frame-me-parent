spring:
  datasource:
    url: jdbc:h2:mem:sso-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379

mybatis-flex:
  datasource:
    master:
      url: jdbc:h2:mem:sso-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
      type: hikari
  global-config:
    logic-delete-column: deleted
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
  configuration:
    map-underscore-to-camel-case: true

me:
  auth:
    sa-token:
      jwt:
        enabled: false
      redis:
        enabled: false
    # 端到端测试同 IP 高频登录，关闭固定窗口限流（生产配置保持开启）
    login-rate-limit:
      enabled: false

# 测试同主配置启用两级缓存；remote 地址由 SsoAuthFlowTest @DynamicPropertySource 指向 Testcontainers
jetcache:
  decodeFilterAllowPatterns:
    - com.frame.me.
  statIntervalMinutes: 0
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 1000
      expireAfterWriteInMillis: 120000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: fastjson2
      valueEncoder: kryo5
      valueDecoder: kryo5
      expireAfterWriteInMillis: 120000
      broadcastChannel: ${spring.application.name}
      uri: redis://${spring.data.redis.host:localhost}:${spring.data.redis.port:6379}/${spring.data.redis.database:0}
