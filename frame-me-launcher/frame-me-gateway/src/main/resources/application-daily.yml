me:
  cloud:
    shutdown:
      # 生产必配：preStop 调 POST /actuator/offline/{token}
      endpoint-token: ${OFFLINE_TOKEN:}
  gateway:
    auth:
      jwt:
        secret: ${JWT_SECRET:me-jwt-secret-key-at-least-32-characters-long-ksndifkwenkfj}
        # 与下游 me.auth.jwt.issuer 同一环境变量联动，默认对齐体系 me
        issuer: ${JWT_ISSUER:me}
#      allow-anonymous: ${ALLOW_ANONYMOUS:false}
      # apps:
      #   - app-key: fm-external-demo
      #     secret: ME(密文)
    access-log:
      enabled: true
